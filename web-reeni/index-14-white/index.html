<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reeni is a modern personal portfolio template for designers, developers, content writer, cleaner, programmer, fashion designer, model, Influencer and freelancers. Fully responsive, SEO-friendly, Bootstrap and easy to customize.">
    <link rel="shortcut icon" type="image/x-icon" href="../assets/images/favicon.svg">
    <title>Home 12 Reeni - Personal Portfolio HTML Template | Freelancer & Developer Portfolio</title>
    <!-- Bootstrap min css -->
    <link rel="stylesheet" href="../assets/css/vendor/fontawesome.css">
    <link rel="stylesheet" href="../assets/css/plugins/swiper.css">
    <link rel="stylesheet" href="../assets/css/plugins/odometer.css">
    <link rel="stylesheet" href="../assets/css/vendor/animate.min.css">
    <link rel="stylesheet" href="../assets/css/vendor/bootstrap.min.css">
    <!-- custom css -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="tmp-white-version">
<div data-component="header"></div>
    <div data-component="mobile-menu"></div>
    <div class="page-with-left-header">
        <div data-component="hero"></div>
        <div data-component="about"></div>
        <div data-component="brands"></div>
        <div data-component="services"></div>
        <div data-component="portfolio"></div>
        <div data-component="experience"></div>
        <div data-component="pricing"></div>
        <div data-component="blog"></div>
        <div data-component="contact"></div>
        <div data-component="footer"></div>
    </div>
    <div data-component="chat-widget"></div>
    <div data-component="scroll-top"></div>
    <div data-component="demo-selector"></div>

    <script src="../component-loader.js"></script>
<script src="../assets/js/vendor/jquery.js"></script>
    <script src="../assets/js/vendor/jquery-ui.min.js"></script>
    <script src="../assets/js/vendor/waypoints.min.js"></script>

    <script src="../assets/js/plugins/odometer.js"></script>
    <script src="../assets/js/vendor/appear.js"></script>


    <script src="../assets/js/vendor/jquery-one-page-nav.js"></script>
    <script src="../assets/js/plugins/swiper.js"></script>

    <script src="../assets/js/plugins/gsap.js"></script>
    <script src="../assets/js/plugins/splittext.js"></script>
    <script src="../assets/js/plugins/scrolltigger.js"></script>
    <script src="../assets/js/plugins/scrolltoplugins.js"></script>
    <script src="../assets/js/plugins/smoothscroll.js"></script>
    <!-- bootstrap Js-->
    <script src="../assets/js/vendor/bootstrap.min.js"></script>
    <script src="../assets/js/vendor/waw.js"></script>
    <script src="../assets/js/plugins/isotop.js"></script>
    <script src="../assets/js/plugins/animation.js"></script>
    <script src="../assets/js/plugins/contact.form.js"></script>
    <script src="../assets/js/vendor/backtop.js"></script>
    <script src="../assets/js/vendor/particle.js"></script>
    <script src="../assets/js/plugins/text-type.js"></script>
    <!-- custom Js -->
    <script src="../assets/js/main.js"></script>

    <script>
        particlesJS('particles-js',

            {
                "particles": {
                    "number": {
                        "value": 7,
                        "density": {
                            "enable": true,
                            "value_area": 1200
                        }
                    },
                    "color": {
                        "value": ["#ffffff", ]
                    },
                    "shape": {
                        "type": "star",
                        "stroke": {
                            "width": 0,
                            "color": "#000000"
                        },
                        "polygon": {
                            "nb_sides": 5
                        },
                        "image": {
                            "src": "img/github.svg",
                            "width": 100,
                            "height": 100
                        }
                    },
                    "opacity": {
                        "value": 0.8,
                        "random": true,
                        "anim": {
                            "enable": false,
                            "speed": 1,
                            "opacity_min": 0.1,
                            "sync": false
                        }
                    },
                    "size": {
                        "value": 4,
                        "random": true,
                        "anim": {
                            "enable": false,
                            "speed": 40,
                            "size_min": 0.1,
                            "sync": false
                        }
                    },
                    "line_linked": {
                        "enable": false,
                        "distance": 150,
                        "color": "#ffffff",
                        "opacity": 0.4,
                        "width": 1
                    },
                    "move": {
                        "enable": true,
                        "speed": 6,
                        "direction": "none",
                        "random": false,
                        "straight": false,
                        "out_mode": "out",
                        "attract": {
                            "enable": false,
                            "rotateX": 600,
                            "rotateY": 1200
                        }
                    }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": {
                        "onhover": {
                            "enable": true,
                            "mode": "repulse"
                        },
                        "onclick": {
                            "enable": true,
                            "mode": "push"
                        },
                        "resize": true
                    },
                    "modes": {
                        "grab": {
                            "distance": 400,
                            "line_linked": {
                                "opacity": 1
                            }
                        },
                        "bubble": {
                            "distance": 800,
                            "size": 40,
                            "duration": 2,
                            "opacity": 8,
                            "speed": 3
                        },
                        "repulse": {
                            "distance": 200
                        },
                        "push": {
                            "particles_nb": 4
                        },
                        "remove": {
                            "particles_nb": 2
                        }
                    }
                },
                "retina_detect": true,
                "config_demo": {
                    "hide_card": false,
                    "background_color": "#b61924",
                    "background_image": "",
                    "background_position": "50% 50%",
                    "background_repeat": "no-repeat",
                    "background_size": "cover"
                }
            }

        );
    </script>
</body>

</html>
